<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevgililer Günü Daveti</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffe6e8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #ff4d6d;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .gif img {
            width: 180px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            font-weight: bold;
        }
        #noBtn {
            background-color: #cccccc;
            color: #333;
        }
        .footer {
            margin-top: 15px;
            font-size: 14px;
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="question">Kavgalarımızda kim haklı küçük woffiem (kıyafet dahil)?</h1>
        
        <div class="gif">
            <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHI1OHR1dDV0eGJuMXdneXhzeDR3azMwcHZ6aWlyOWVsdWNmNHZyNSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" alt="Cute Gif">
        </div>

        <div class="buttons">
            <button id="yesBtn" onclick="acceptInvitation()">dehşetül vahşet diva balım 💖</button>
            <button id="noBtn" onclick="handleNo()">küçük mızmız woffie 🐾</button>
        </div>

        <div class="footer">
            From: <span id="from">Sana deliler gibi aşık olan sevgilin</span> <br>
            To: <span id="to">Woffiem</span>
        </div>
    </div>

    <script>
        // URL'den parametre gelirse al, gelmezse varsayılan Türkçe metinleri koru
        const urlParams = new URLSearchParams(window.location.search);
        const fromParam = urlParams.get('from');
        const toParam = urlParams.get('to');

        if (fromParam) document.getElementById('from').textContent = fromParam;
        if (toParam) document.getElementById('to').textContent = toParam;

        let noClickCount = 0;
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');

        function handleNo() {
            noClickCount++;
            let currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = (currentSize + 6) + 'px';
            yesBtn.style.padding = (12 + noClickCount * 4) + 'px ' + (20 + noClickCount * 6) + 'px';
            
            const noTexts = [
                "Emin misin? 🥺",
                "Bir daha düşün bence! 💔",
                "Gerçekten mi? 😢",
                "Beni üzüyorsun ama... 🐾",
                "Son kararın mı?"
            ];
            if (noClickCount <= noTexts.length) {
                noBtn.textContent = noTexts[noClickCount - 1];
            }
        }

        function acceptInvitation() {
            document.getElementById('question').textContent = "Biliyordum! Seni çok seviyorum! ❤️✨";
            document.getElementById('mainGif').src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbm93aTV2MWJxdWVndm91OWVpNmFwcmIxeTlndTRpYWJmOWx4azV2eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/G6FSC6XYA160/giphy.gif";
            document.querySelector('.buttons').style.display = 'none';
        }
    </script>

</body>
</html>
